<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurse Dashboard - PickOne Medical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col">

    <div id="navbar"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-4" id="flashZone"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Ward Telemetry &amp; Intake</h1>
                <p class="text-sm text-gray-500 mt-1">Record patient vitals and review non-confidential medical history.</p>
            </div>

            <div class="flex flex-row gap-1">
                <div class="mt-4 md:mt-0 relative">
                    <form action="/nurse/dashboard" method="GET">
                        <input type="text" name="search_id" id="searchInput" placeholder="Search Patient ID (e.g., PAT-1042)"
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        <button type="submit" class="absolute left-3 top-2.5">
                            <svg class="w-5 h-5 text-gray-400 hover:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </button>
                    </form>
                </div>
                <div>
                    <button id="openAppointmentsBtn"
                        class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 shadow-sm transition-colors flex items-center gap-2 h-[42px]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        Manage Appointments
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div class="lg:col-span-1 bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden h-fit">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-800">Record New Vitals</h2>
                    <span id="patientFoundBadge" class="hidden text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded">Patient Found</span>
                </div>

                <form id="vitalsForm" class="p-6 space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Patient ID</label>
                        <input type="text" name="patient_id" id="vitalsPatientId" required placeholder="e.g., PAT-1042"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Blood Pressure</label>
                            <input type="text" name="bp" placeholder="120/80"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Heart Rate (bpm)</label>
                            <input type="number" name="heart_rate" placeholder="72"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Temp (°C)</label>
                            <input type="number" step="0.1" name="temperature" placeholder="36.5"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">SpO2 (%)</label>
                            <input type="number" name="spo2" placeholder="98"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Weight (kg)</label>
                            <input type="number" step="0.1" name="weight" placeholder="70.5"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Height (cm)</label>
                            <input type="number" name="height" placeholder="175"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nursing Observations</label>
                        <textarea name="nurse_notes" rows="3" placeholder="Patient appears stable..."
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md shadow-sm transition-colors">
                        Save to Medical Record
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-fit">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-800">Historical Telemetry</h2>
                    <span id="telemetryHeader"></span>
                </div>

                <div class="p-0 overflow-x-auto" id="telemetryBody"></div>
            </div>

        </div>
    </main>

    <div id="editProfileModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-900">Edit Patient Profile</h3>
                <button data-close="editProfileModal" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <form id="editProfileForm" class="p-6 space-y-4">
                <input type="hidden" name="patient_id" id="editPatientId">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                        <input type="date" name="dob" id="editDob" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                        <select name="gender" id="editGender"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="M">Male (M)</option>
                            <option value="F">Female (F)</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Blood Type</label>
                    <select name="blood_type" id="editBloodType"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Allergies (Comma separated)</label>
                    <textarea name="allergies" id="editAllergies" rows="2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Active Medications (Comma separated)</label>
                    <textarea name="active_medications" id="editMedications" rows="2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>

                <div class="mt-6 pt-4 border-t border-gray-100 flex justify-end gap-3">
                    <button type="button" data-close="editProfileModal"
                        class="px-4 py-2 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700">Save Profile</button>
                </div>
            </form>
        </div>
    </div>

    <div id="appointmentsModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-900">Upcoming Appointments</h3>
                <button data-close="appointmentsModal" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="p-0 overflow-y-auto flex-grow">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-white sticky top-0 shadow-sm">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date &amp; Time</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Patient ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Provider</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Reason</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsBody" class="bg-white divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/data.js"></script>
    <script src="/js/app.js"></script>
    <script>
        POM.demoBanner();
        const user = POM.guard({ role: 'nurse', active: 'dashboard' });
        if (user) {
            const esc = POM.escapeHtml;
            let activePatient = null;

            const telemetryBody = document.getElementById('telemetryBody');
            const telemetryHeader = document.getElementById('telemetryHeader');
            const patientFoundBadge = document.getElementById('patientFoundBadge');

            /* ---------- Appointment table (shared markup with doctor page) ---------- */
            function statusBadge(status) {
                const styles = status === 'Approved'
                    ? 'bg-green-100 text-green-800'
                    : status === 'Pending'
                        ? 'bg-yellow-100 text-yellow-800'
                        : 'bg-red-100 text-red-800';
                return '<span class="px-2 py-1 text-xs font-bold rounded-full ' + styles + '">' + esc(status) + '</span>';
            }

            function appointmentActions(appt) {
                if (appt.status === 'Pending') {
                    return '<button data-appt-id="' + appt.id + '" data-appt-status="Approved" class="appt-action text-green-600 hover:text-green-900 bg-green-50 hover:bg-green-100 px-2 py-1 rounded transition-colors">Approve</button>' +
                           '<button data-appt-id="' + appt.id + '" data-appt-status="Cancelled" class="appt-action text-red-600 hover:text-red-900 bg-red-50 hover:bg-red-100 px-2 py-1 rounded transition-colors">Cancel</button>';
                }
                if (appt.status === 'Approved') {
                    return '<button data-appt-id="' + appt.id + '" data-appt-status="Cancelled" class="appt-action text-red-600 hover:text-red-900 bg-red-50 hover:bg-red-100 px-2 py-1 rounded transition-colors">Cancel</button>';
                }
                return '<span class="text-gray-400 text-xs">No actions</span>';
            }

            function renderAppointments() {
                const rows = POM.DB.appointments().map((appt) => {
                    return '<tr class="hover:bg-gray-50 transition-colors">' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">' + esc(appt.appointment_date) +
                            '<br><span class="text-xs text-gray-500 font-normal">' + esc(appt.appointment_time) + '</span></td>' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm text-blue-600 font-bold">' + esc(appt.patient_id) + '</td>' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + esc(appt.doctor_name) + '</td>' +
                        '<td class="px-6 py-4 text-sm text-gray-600 max-w-xs truncate" title="' + esc(appt.reason) + '">' + esc(appt.reason) + '</td>' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm">' + statusBadge(appt.status) + '</td>' +
                        '<td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium flex justify-center gap-2">' + appointmentActions(appt) + '</td>' +
                    '</tr>';
                }).join('');

                document.getElementById('appointmentsBody').innerHTML = rows ||
                    '<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500 text-sm">No upcoming appointments found.</td></tr>';
            }

            document.getElementById('appointmentsBody').addEventListener('click', (event) => {
                const button = event.target.closest('.appt-action');
                if (!button) return;
                POM.DB.setAppointmentStatus(button.dataset.apptId, button.dataset.apptStatus);
                POM.Flash.push('success', 'Appointment marked as ' + button.dataset.apptStatus + '.');
                renderAppointments();
                POM.Flash.render();
            });

            /* ---------- Telemetry table ---------- */
            function renderTelemetry(patient) {
                activePatient = patient;

                if (!patient) {
                    patientFoundBadge.classList.add('hidden');
                    telemetryHeader.innerHTML = '<span class="text-xs font-medium bg-gray-200 text-gray-600 py-1 px-2 rounded-full">No Patient Selected</span>';
                    telemetryBody.innerHTML =
                        '<div class="flex flex-col items-center justify-center h-64 text-gray-400">' +
                            '<svg class="w-12 h-12 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>' +
                            '<p>Search for a patient to view telemetry history.</p>' +
                        '</div>';
                    return;
                }

                patientFoundBadge.classList.remove('hidden');
                telemetryHeader.innerHTML = '<span class="text-xs font-medium bg-blue-100 text-blue-800 py-1 px-2 rounded-full">Displaying: ' +
                    esc(patient.patient_id) + ' (' + esc(patient.first_name + ' ' + patient.last_name) + ')</span> ' +
                    '<button id="openEditProfileBtn" class="text-xs text-blue-600 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-full transition-colors border shadow-sm border-blue-200 ml-1">✏️ Edit Profile</button>';

                document.getElementById('openEditProfileBtn').addEventListener('click', () => openModal('editProfileModal'));

                document.getElementById('vitalsPatientId').value = patient.patient_id;
                document.getElementById('editPatientId').value = patient.patient_id;
                document.getElementById('editDob').value = patient.dob || '';
                document.getElementById('editGender').value = ['M', 'F'].includes(patient.gender) ? patient.gender : 'Other';
                document.getElementById('editBloodType').value = patient.blood_type || 'A+';
                document.getElementById('editAllergies').value = patient.allergies || '';
                document.getElementById('editMedications').value = patient.active_medications || '';

                const vitals = POM.DB.records(patient.patient_id, 'desc');
                if (!vitals.length) {
                    telemetryBody.innerHTML = '<div class="text-center py-12"><p class="text-gray-500">No telemetry data recorded for this patient yet.</p></div>';
                    return;
                }

                const rows = vitals.map((record) => {
                    const spo2Class = record.spo2 != null && record.spo2 < 95
                        ? 'text-red-600 font-bold'
                        : 'text-green-600 font-medium';
                    return '<tr class="hover:bg-gray-50 transition-colors">' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + esc(POM.formatDateTime(record.timestamp)) + '</td>' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + esc(record.bp || '--') + '</td>' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + esc(record.heart_rate != null ? record.heart_rate : '--') + '</td>' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + esc(record.temperature != null ? record.temperature : '--') + '°C</td>' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm ' + spo2Class + '">' + esc(record.spo2 != null ? record.spo2 : '--') + '%</td>' +
                        '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">' + esc(record.recorded_by) + '</td>' +
                    '</tr>';
                }).join('');

                telemetryBody.innerHTML =
                    '<table class="min-w-full divide-y divide-gray-200">' +
                        '<thead class="bg-white"><tr>' +
                            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date &amp; Time</th>' +
                            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">BP</th>' +
                            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">HR</th>' +
                            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Temp</th>' +
                            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">SpO2</th>' +
                            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Recorded By</th>' +
                        '</tr></thead>' +
                        '<tbody class="bg-white divide-y divide-gray-100">' + rows + '</tbody>' +
                    '</table>';
            }

            /* ---------- Modals ---------- */
            function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
            function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

            document.querySelectorAll('[data-close]').forEach((button) => {
                button.addEventListener('click', () => closeModal(button.dataset.close));
            });

            document.getElementById('openAppointmentsBtn').addEventListener('click', () => {
                renderAppointments();
                openModal('appointmentsModal');
                document.body.style.overflow = 'hidden';
            });

            const appointmentsModal = document.getElementById('appointmentsModal');
            new MutationObserver(() => {
                if (appointmentsModal.classList.contains('hidden')) document.body.style.overflow = 'auto';
            }).observe(appointmentsModal, { attributes: true, attributeFilter: ['class'] });

            /* ---------- Forms ---------- */
            document.getElementById('vitalsForm').addEventListener('submit', (event) => {
                event.preventDefault();
                const form = event.target;
                const patientId = form.elements.patient_id.value.trim();
                const patient = POM.DB.findPatient(patientId);

                if (!patient) {
                    POM.Flash.push('error', 'Cannot save record: Patient ID ' + patientId + ' not found in system.');
                    POM.redirect('/nurse/dashboard');
                    return;
                }

                const numberOrNull = (value) => (value === '' || value == null ? null : Number(value));

                POM.DB.addRecord({
                    patient_id: patientId,
                    recorded_by: 'Nurse ' + user.user_name,
                    bp: form.elements.bp.value.trim() || null,
                    heart_rate: numberOrNull(form.elements.heart_rate.value),
                    temperature: numberOrNull(form.elements.temperature.value),
                    spo2: numberOrNull(form.elements.spo2.value),
                    weight: numberOrNull(form.elements.weight.value),
                    height: numberOrNull(form.elements.height.value),
                    nurse_notes: form.elements.nurse_notes.value.trim()
                });

                POM.Flash.push('success', 'Vitals successfully saved to patient record.');
                POM.redirectWithQuery('/nurse/dashboard', { search_id: patientId });
            });

            document.getElementById('editProfileForm').addEventListener('submit', (event) => {
                event.preventDefault();
                const form = event.target;
                const patientId = form.elements.patient_id.value;
                POM.DB.updatePatient(patientId, {
                    dob: form.elements.dob.value,
                    gender: form.elements.gender.value,
                    blood_type: form.elements.blood_type.value,
                    allergies: form.elements.allergies.value,
                    active_medications: form.elements.active_medications.value
                });
                closeModal('editProfileModal');
                POM.Flash.push('success', 'Patient profile updated successfully.');
                renderTelemetry(POM.DB.findPatient(patientId));
                POM.Flash.render();
            });

            /* ---------- Boot ---------- */
            const searchId = POM.queryString('search_id');
            document.getElementById('searchInput').value = searchId;

            if (searchId) {
                const patient = POM.DB.findPatient(searchId);
                if (patient) {
                    renderTelemetry(patient);
                } else {
                    POM.Flash.push('error', 'Patient ' + searchId + ' not found.');
                    POM.Flash.render();
                    renderTelemetry(null);
                }
            } else {
                // For the show demo, preload the flagship patient record.
                renderTelemetry(POM.DB.findPatient('PAT-1042'));
            }
        }
    </script>
</body>
</html>
