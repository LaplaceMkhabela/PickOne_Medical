<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - PickOne Medical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col">

    <div id="navbar"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-4" id="flashZone"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="max-w-3xl mx-auto py-8">
            <div class="mb-8 text-center">
                <h1 class="text-3xl font-bold text-gray-900">How can we help?</h1>
                <p class="text-gray-500 mt-2">Send us a message and our support team will get back to you within 24 hours.</p>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-4 bg-blue-50 border-b border-blue-100 flex items-center gap-3">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <h2 class="text-lg font-semibold text-blue-900">Email Support</h2>
                </div>

                <form id="supportForm" class="p-8 space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                            <input type="text" id="supportName" disabled class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-500 cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Account Email</label>
                            <input type="email" id="supportEmail" disabled class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-500 cursor-not-allowed">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                        <select name="subject" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="" disabled selected>Choose a topic...</option>
                            <option value="Technical Issue / Bug Report">Technical Issue / Bug Report</option>
                            <option value="Billing & Subscriptions">Billing &amp; Subscriptions</option>
                            <option value="Feature Request">Feature Request</option>
                            <option value="General Feedback">General Feedback</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                        <textarea name="message" rows="6" required placeholder="Please describe your issue in detail..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-sm transition-colors flex justify-center items-center gap-2">
                        Send Message
                    </button>
                    <p class="text-xs text-center text-gray-400 mt-4">Demo only — no email is actually sent.</p>
                </form>
            </div>
        </div>
    </main>

    <script src="/js/data.js"></script>
    <script src="/js/app.js"></script>
    <script>
        POM.demoBanner();
        const user = POM.guard({ active: 'support' });
        if (user) {
            document.getElementById('supportName').value = user.user_name;
            document.getElementById('supportEmail').value = user.user_email;

            document.getElementById('supportForm').addEventListener('submit', (event) => {
                event.preventDefault();
                // Mirrors app.py's simulated email dispatch.
                POM.Flash.push('success', 'Your message has been sent to our support team. We will reply shortly!');
                POM.redirect('/support');
            });
        }
    </script>
</body>
</html>
