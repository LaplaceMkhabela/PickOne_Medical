<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PickOne Medical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col">

    <div id="navbar"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-4" id="flashZone"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="min-h-[80vh] flex items-center justify-center py-8">
            <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100 max-w-md w-full">

                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Create an Account</h2>
                    <p class="text-sm text-gray-500 mt-2">Join the PickOne Medical platform</p>
                </div>

                <form id="registerForm" class="space-y-5">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" name="name" required placeholder="John Doe"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" name="email" required placeholder="john@example.com"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">User ID</label>
                        <input type="text" name="id" required placeholder="Choose a unique ID"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">I am registering as a...</label>
                        <select name="role" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white">
                            <option value="" disabled selected>Select your role</option>
                            <option value="doctor">Doctor</option>
                            <option value="nurse">Nurse</option>
                            <option value="patient">Patient</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" name="password" required placeholder="Create a strong password"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 mt-4">
                        Create Account
                    </button>
                </form>

                <p class="mt-6 text-center text-sm text-gray-600">
                    Already have an account?
                    <a href="/login" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline">Sign in here</a>
                </p>

            </div>
        </div>
    </main>

    <script src="/js/data.js"></script>
    <script src="/js/app.js"></script>
    <script>
        POM.demoBanner();
        POM.guard({ anonymous: true });

        const form = document.getElementById('registerForm');

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const result = POM.DB.addUser({
                user_name: form.elements.name.value.trim(),
                user_id: form.elements.id.value.trim(),
                user_email: form.elements.email.value.trim(),
                user_role: form.elements.role.value,
                password: form.elements.password.value
            });

            if (!result.ok) {
                POM.Flash.push('error', result.error);
                POM.Flash.render();
                return;
            }

            POM.Flash.push('success', 'Account created successfully! Please log in.');
            POM.redirect('/login');
        });
    </script>
</body>
</html>
