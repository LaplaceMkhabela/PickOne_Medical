<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PickOne Medical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col">

    <div id="navbar"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-4" id="flashZone"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="min-h-[80vh] flex items-center justify-center">
            <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100 max-w-md w-full">

                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Welcome Back</h2>
                    <p class="text-sm text-gray-500 mt-2">Please sign in to your account</p>
                </div>

                <form id="loginForm" class="space-y-6">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">I am a...</label>
                        <select name="role" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                            <option value="" disabled selected>Select your role</option>
                            <option value="doctor">Doctor</option>
                            <option value="nurse">Nurse</option>
                            <option value="patient">Patient</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">User ID</label>
                        <input type="text" name="id" required placeholder="Enter your ID"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" name="password" required placeholder="••••••••"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition-all duration-200">
                        Sign In
                    </button>
                </form>

                <p class="mt-6 text-center text-sm text-gray-600">
                    Don't have an account?
                    <a href="/register" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline">Register here</a>
                </p>

                <div class="mt-8 pt-6 border-t border-gray-100">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Demo Accounts</p>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <button type="button" data-demo="doctor" class="demo-account text-left px-3 py-2 rounded-lg border border-gray-200 hover:border-blue-300 hover:bg-blue-50 transition-colors">
                            <span class="block text-sm font-semibold text-gray-800">Doctor</span>
                            <span class="block text-xs text-gray-500">DOC-100</span>
                        </button>
                        <button type="button" data-demo="nurse" class="demo-account text-left px-3 py-2 rounded-lg border border-gray-200 hover:border-blue-300 hover:bg-blue-50 transition-colors">
                            <span class="block text-sm font-semibold text-gray-800">Nurse</span>
                            <span class="block text-xs text-gray-500">NUR-100</span>
                        </button>
                        <button type="button" data-demo="patient" class="demo-account text-left px-3 py-2 rounded-lg border border-gray-200 hover:border-blue-300 hover:bg-blue-50 transition-colors">
                            <span class="block text-sm font-semibold text-gray-800">Patient</span>
                            <span class="block text-xs text-gray-500">PAT-1042</span>
                        </button>
                    </div>
                    <p class="text-xs text-gray-400 mt-3">Password for all demo accounts: <strong class="text-gray-600">password123</strong></p>
                </div>

            </div>
        </div>
    </main>

    <script src="/js/data.js"></script>
    <script src="/js/app.js"></script>
    <script>
        POM.demoBanner();
        POM.guard({ anonymous: true });

        const DEMO_ACCOUNTS = {
            doctor: { role: 'doctor', id: 'DOC-100' },
            nurse: { role: 'nurse', id: 'NUR-100' },
            patient: { role: 'patient', id: 'PAT-1042' }
        };

        const form = document.getElementById('loginForm');

        document.querySelectorAll('.demo-account').forEach((button) => {
            button.addEventListener('click', () => {
                const account = DEMO_ACCOUNTS[button.dataset.demo];
                form.elements.role.value = account.role;
                form.elements.id.value = account.id;
                form.elements.password.value = 'password123';
                form.elements.password.focus();
            });
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const role = form.elements.role.value;
            const userId = form.elements.id.value.trim();
            const password = form.elements.password.value;

            const user = POM.DB.findUser(userId, role);

            if (user && user.password === password) {
                POM.Session.create(user);
                POM.Flash.push('success', 'Welcome back, ' + user.user_name + '!');
                POM.redirect(POM.Session.dashboardUrl());
                return;
            }

            POM.Flash.push('error', 'Invalid User ID, Password, or Role mismatch.');
            POM.Flash.render();
        });
    </script>
</body>
</html>
